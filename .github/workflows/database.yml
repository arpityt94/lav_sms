
name: Export LAV SMS Database

on:
  workflow_dispatch:

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lav_sms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, bcmath, pdo_mysql, xml, curl, gd, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Configure Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=homestead/DB_DATABASE=lav_sms/' .env
          sed -i 's/DB_USERNAME=homestead/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=secret/DB_PASSWORD=root/' .env

      - name: Run migrations and seeders
        run: php artisan migrate --seed --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: lav_sms
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Export SQL
        run: mysqldump -h 127.0.0.1 -uroot -proot lav_sms > lav-sms-database.sql

      - name: Upload SQL file
        uses: actions/upload-artifact@v4
        with:
          name: lav-sms-database
          path: lav-sms-database.sql
          retention-days: 7
          
